[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.1.0"
description = "Deterministic WIP enforcement scoring"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "John Malone" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
talos = "talos.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["talos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
